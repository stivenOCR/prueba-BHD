# ==============================================================================
# Configuración SonarQube / SonarCloud para Proyecto DevOps BHD
# ==============================================================================
sonar.projectKey=stivenOCR_prueba-BHD
sonar.projectName=DevOps Sample App
sonar.projectVersion=1.0.0

# Rutas de código fuente y pruebas
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.js
sonar.exclusions=node_modules/**,coverage/**,output-files/**

# Cobertura de pruebas unitarias Jest (LCOV)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gate
sonar.qualitygate.wait=true
