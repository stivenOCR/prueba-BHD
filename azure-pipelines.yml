trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  imageRepository: 'stivendevcr/devops-sample-app'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

stages:
  # ============================================================================
  # STAGE 1: Control de Calidad y Pruebas Unitarias
  # ============================================================================
  - stage: Quality_And_Test
    displayName: '1. Quality Assurance & Testing'
    jobs:
      - job: TestAndScan
        displayName: 'Ejecutar Jest Tests y Verificación de Calidad'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
            displayName: 'Instalar Node.js 20.x'

          - script: |
              echo "=== INSTALANDO DEPENDENCIAS Y CORRIENDO TESTS CON COBERTURA ==="
              npm ci
              npm test
            displayName: 'Ejecutar Pruebas Unitarias (Jest Coverage)'

          - script: |
              echo "=== VERIFICACIÓN ESTÁTICA DE CÓDIGO ==="
              echo "Leyendo reglas de sonar-project.properties..."
              cat sonar-project.properties
              echo ""
              echo "Quality Gate Validado: Cobertura > 80% requerida."
            displayName: 'Simulación Quality Gate SonarQube'

  # ============================================================================
  # STAGE 2: Automatización en Pipeline (Requisitos 5a y 5b)
  # ============================================================================
  - stage: Automation_Tasks
    displayName: '2. Tareas de Automatización'
    dependsOn: Quality_And_Test
    jobs:
      # Requisito 5a: Imprimir "Hola Mundo" 10 veces en pantalla con un job paralelo
      - job: ParallelHelloWorld
        displayName: '5a. Hola Mundo Paralelo'
        strategy:
          matrix:
            Worker_01:
              TaskIndex: 1
            Worker_02:
              TaskIndex: 2
            Worker_03:
              TaskIndex: 3
            Worker_04:
              TaskIndex: 4
            Worker_05:
              TaskIndex: 5
            Worker_06:
              TaskIndex: 6
            Worker_07:
              TaskIndex: 7
            Worker_08:
              TaskIndex: 8
            Worker_09:
              TaskIndex: 9
            Worker_10:
              TaskIndex: 10
          maxParallel: 10
        steps:
          - script: |
              echo "=========================================="
              echo "[JOB PARALELO $(TaskIndex)/10] Hola Mundo"
              echo "Ejecutado por Worker ID: $(TaskIndex)"
              echo "Timestamp: $(date -u)"
              echo "=========================================="
            displayName: 'Imprimir Hola Mundo en paralelo'

      # Requisito 5b: Script que cree 10 archivos con la fecha y luego los imprima
      - job: CreateDatedFiles
        displayName: '5b. Generar y Listar 10 Archivos con Fecha'
        steps:
          - bash: |
              chmod +x ./scripts/create_files.sh
              ./scripts/create_files.sh
            displayName: 'Ejecutar script Bash para 10 archivos con fecha'

  # ============================================================================
  # STAGE 3: Construcción y Push a Docker Hub (Requisito 4)
  # ============================================================================
  - stage: Build_And_Push_Docker
    displayName: '3. Docker Build & Push'
    dependsOn: Automation_Tasks
    jobs:
      - job: DockerBuildAndPush
        displayName: 'Build and Push Docker Image'
        steps:
          - script: |
              echo "=== 1. CONSTRUYENDO IMAGEN DOCKER ==="
              docker build -t $(imageRepository):$(tag) -t $(imageRepository):latest .
              echo "=== IMAGEN GENERADA EXITOSAMENTE ==="
              docker images | grep devops-sample-app
            displayName: 'Docker Build Multi-Stage'

          - bash: |
              echo "=== 2. AUTENTICANDO CON DOCKER HUB ==="
              if [ -n "$DOCKER_PASSWORD" ]; then
                echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
                echo "=== 3. PUBLICANDO IMAGEN EN DOCKER HUB ==="
                docker push $(imageRepository):$(tag)
                docker push $(imageRepository):latest
                echo "=== IMAGEN PUBLICADA EXITOSAMENTE DESDE PIPELINE ==="
              else
                echo "[INFO] Credenciales de Docker Hub no suministradas como secretos en este entorno."
                echo "Comando preparado para ejecutar: docker push $(imageRepository):$(tag)"
              fi
            displayName: 'Docker Push to DockerHub Registry'
            env:
              DOCKER_USERNAME: $(DOCKER_USERNAME)
              DOCKER_PASSWORD: $(DOCKER_PASSWORD)

  # ============================================================================
  # STAGE 4: Validación y Despliegue en Kubernetes (Requisitos 6, 7 y 8)
  # ============================================================================
  - stage: Kubernetes_Validation
    displayName: '4. Despliegue y Validación K8s'
    dependsOn: Build_And_Push_Docker
    jobs:
      - job: ValidateAndDeployK8s
        displayName: 'Validar Manifiestos de environment/'
        steps:
          - script: |
              echo "=== VALIDANDO MANIFIESTOS SINTÁCTICOS DE KUBERNETES ==="
              kubectl apply --dry-run=client -k environment/
              echo "=== ESTRUCTURA DE LA CARPETA ENVIRONMENT ==="
              ls -la environment/
            displayName: 'Kubectl Dry-Run & Manifest Validation'
