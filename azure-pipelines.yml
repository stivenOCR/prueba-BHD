trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  dockerRegistryServiceConnection: 'dockerhub-connection'
  imageRepository: 'stivenocr/devops-sample-app'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

stages:
  # ============================================================================
  # STAGE 1: Control de Calidad y Pruebas Unitarias (SonarQube)
  # ============================================================================
  - stage: Quality_And_Test
    displayName: '1. Quality Assurance & Testing'
    jobs:
      - job: TestAndSonar
        displayName: 'Ejecutar Jest Tests y Análisis SonarQube'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
            displayName: 'Instalar Node.js 20.x'

          - script: |
              npm ci
              npm test
            displayName: 'Instalar dependencias y correr tests con cobertura'

          - task: SonarQubePrepare@5
            inputs:
              SonarQube: 'sonarqube-connection'
              scannerMode: 'CLI'
              configMode: 'file'
              configFile: 'sonar-project.properties'
            displayName: 'Preparar análisis de SonarQube'

          - task: SonarQubeAnalyze@5
            displayName: 'Ejecutar análisis de código SonarQube'

          - task: SonarQubePublish@5
            inputs:
              pollingTimeoutSec: '300'
            displayName: 'Publicar resultados del Quality Gate'

  # ============================================================================
  # STAGE 2: Automatización en Pipeline (Requisitos 5a y 5b)
  # ============================================================================
  - stage: Automation_Tasks
    displayName: '2. Tareas de Automatización'
    dependsOn: Quality_And_Test
    jobs:
      # Requisito 5a: Imprimir "Hola Mundo" 10 veces en pantalla con un job paralelo
      - job: ParallelHelloWorld
        displayName: '5a. Hola Mundo Paralelo'
        strategy:
          matrix:
            Worker_01:
              TaskIndex: 1
            Worker_02:
              TaskIndex: 2
            Worker_03:
              TaskIndex: 3
            Worker_04:
              TaskIndex: 4
            Worker_05:
              TaskIndex: 5
            Worker_06:
              TaskIndex: 6
            Worker_07:
              TaskIndex: 7
            Worker_08:
              TaskIndex: 8
            Worker_09:
              TaskIndex: 9
            Worker_10:
              TaskIndex: 10
          maxParallel: 10
        steps:
          - script: |
              echo "=========================================="
              echo "[JOB PARALELO $(TaskIndex)/10] Hola Mundo"
              echo "Ejecutado por Worker ID: $(TaskIndex)"
              echo "Timestamp: $(date -u)"
              echo "=========================================="
            displayName: 'Imprimir Hola Mundo en paralelo'

      # Requisito 5b: Script que cree 10 archivos con la fecha y luego los imprima
      - job: CreateDatedFiles
        displayName: '5b. Generar y Listar 10 Archivos con Fecha'
        steps:
          - bash: |
              chmod +x ./scripts/create_files.sh
              ./scripts/create_files.sh
            displayName: 'Ejecutar script Bash para 10 archivos con fecha'

  # ============================================================================
  # STAGE 3: Construcción y Publicación de Contenedor Docker
  # ============================================================================
  - stage: Build_And_Push_Docker
    displayName: '3. Docker Build & Push'
    dependsOn: Automation_Tasks
    jobs:
      - job: DockerBuild
        displayName: 'Build and Push Docker Image'
        steps:
          - task: Docker@2
            displayName: 'Construir imagen Docker'
            inputs:
              command: build
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              tags: |
                $(tag)
                latest

          - task: Docker@2
            displayName: 'Publicar imagen en Registro (DockerHub/ACR)'
            inputs:
              command: push
              containerRegistry: $(dockerRegistryServiceConnection)
              repository: $(imageRepository)
              tags: |
                $(tag)
                latest

  # ============================================================================
  # STAGE 4: Despliegue en Kubernetes (Requisitos 6, 7 y 8)
  # ============================================================================
  - stage: Kubernetes_Deploy
    displayName: '4. Despliegue en Kubernetes'
    dependsOn: Build_And_Push_Docker
    jobs:
      - job: DeployToK8s
        displayName: 'Aplicar manifiestos de environment/'
        steps:
          - task: KubernetesManifest@1
            displayName: 'Desplegar Manifiestos K8s (Deployment, Service, Ingress)'
            inputs:
              action: 'deploy'
              connectionType: 'kubernetesServiceConnection'
              kubernetesServiceConnection: 'k8s-cluster-connection'
              manifests: |
                $(Build.SourcesDirectory)/environment/deployment.yaml
                $(Build.SourcesDirectory)/environment/service.yaml
                $(Build.SourcesDirectory)/environment/ingress.yaml

